name: Deploy na Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # IDs do projeto (não são segredos). O token fica no secret VERCEL_TOKEN.
      VERCEL_ORG_ID: team_jqWm308ryIzIFYPxuhgxCyKb
      VERCEL_PROJECT_ID: prj_UB9dT0SC2Nqn8KPypWD6S0k1eBmR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Crie o secret VERCEL_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy de produção
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@54.4.1 deploy --prod --yes --token "$VERCEL_TOKEN"
